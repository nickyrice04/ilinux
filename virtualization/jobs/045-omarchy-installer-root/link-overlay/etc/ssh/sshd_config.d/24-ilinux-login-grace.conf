# VM job 045 (LINK=1), attempt 26's finding: on the cabled port the idle sshd (started once the M1 had configured
# the port, with no client yet) ran out its 45 s login grace time, exited and was restarted every 47 s, four
# journal lines each time, 67 times in 63 minutes. sshd on this pipe cannot see a client that never
# authenticates go away (bulk endpoints carry no hang-up), so the grace time does two jobs: it recycles the idle
# sshd, and it frees the port after a handshake that stalled (a refused key, a killed ssh). 180 s makes the idle
# cycle four times rarer (about 80 journal lines an hour instead of 300) and bounds a stalled handshake's hold
# on the only control channel to three minutes; the M1's sessions authenticate within a second and are not
# affected. Not 0 (no limit): a stalled handshake would then hold the pipe until the next boot.
# sshd keeps the first value it reads for a keyword and includes sshd_config.d in lexical order, so this file,
# sorting before job 039's 25-ilinux-usb-pipe.conf (LoginGraceTime 45, left as committed), sets the value.
LoginGraceTime 180
