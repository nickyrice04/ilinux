# VM job 045 (LINK=1), attempt 25's finding: on a port no host has configured (no cable), sshd -i timed out
# after its 45 s login grace time and was restarted every 47 s, three journal lines each time. sshd now
# starts only once a host has configured the port (wait-usb-host, silent while it waits), and the grace
# time's own exit (status 3 since OpenSSH 9.8) is a clean end rather than a failure.
[Service]
ExecStartPre=/usr/local/lib/ilinux/wait-usb-host %i
TimeoutStartSec=infinity
SuccessExitStatus=3
