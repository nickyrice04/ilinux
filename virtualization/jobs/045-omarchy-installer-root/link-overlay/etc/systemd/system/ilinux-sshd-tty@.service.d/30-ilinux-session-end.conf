# VM job 045 (LINK=1), attempt 26's finding: every SSH session's end was logged as a failure of the unit
# ("Main process exited, code=exited, status=255/EXCEPTION", "Failed with result 'exit-code'": 22 times in
# attempt 26, two lines each). sshd in inetd mode ends a connection, an ordinary disconnect included, by
# exiting 255 (cleanup_exit), and the unit restarts it for the next connection: that exit is the normal end
# of a session on this pipe, so it counts as a success; sshd's own log line still says why a connection
# ended. Adds to deviation 27's SuccessExitStatus=3 (systemd merges the lists).
[Service]
SuccessExitStatus=255
