# VM job 045 (LINK=1 with MODULES), boot042 / attempt 26: the keyboard path's modules load only when
# ilinux-keyboard (run over SSH) asks for them by name, one at a time. udev loads modules by the aliases
# of the devices it finds at every boot; a blacklist entry stops exactly that (modprobe still loads a
# module named on its command line), so nothing of the keyboard path runs before the attempt starts it.
blacklist apple_rtkit_helper
blacklist apple_dockchannel
blacklist dockchannel_hid
blacklist hid_apple
