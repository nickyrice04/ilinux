%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/apple,t6050-cluster-cpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Experimental Apple T6050 cluster CPU frequency controller

maintainers:
  - iLinux <ilinux@localhost>

description: |
  Downstream experimental command-register-only binding. The t8112 fallback
  is deliberately absent because its status-register layout is not established
  on t6050. Frequencies come from OPP tables; opp-level is a hardware request
  code. Matching this schema does not establish native DVFS compatibility.

properties:
  compatible:
    const: apple,t6050-cluster-cpufreq
  reg:
    maxItems: 1
  '#performance-domain-cells':
    const: 0

required:
  - compatible
  - reg
  - '#performance-domain-cells'

additionalProperties: false
