# /etc/omarchy-qos.conf - tier tuning (uclamp values are % of max capacity).
# Defaults derive from macOS behaviour measured on M5 Max: background QoS ran
# at ~25-35% of P-core throughput on the M clusters (findings F-002).
INTERACTIVE_UCLAMP_MIN=20
INTERACTIVE_WEIGHT=400
UTILITY_UCLAMP_MAX=70
UTILITY_WEIGHT=50
BACKGROUND_UCLAMP_MAX=30
BACKGROUND_WEIGHT=20
BACKGROUND_RESTRICT_CPUS=yes
