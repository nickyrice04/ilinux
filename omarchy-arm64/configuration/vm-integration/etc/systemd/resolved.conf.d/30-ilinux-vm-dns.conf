# VM guests: the Virtualization.framework / QEMU NAT DNS proxies may not answer
# (observed: queries to 192.168.64.1 time out), so resolve through Quad9 with
# DNS-over-TLS instead.  Encrypted DNS also matches the project's privacy goal.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
DNSOverTLS=opportunistic
Domains=~.
