# Omarchy VM (QEMU/HVF + Venus): Vulkan FIFO pacing.
# Mesa's Wayland WSI aims each FIFO commit at a wp_commit_timer_v1 timestamp
# derived from presentation feedback. The VM has no real vblank behind that
# feedback, so about one commit in four waited an extra refresh (vkcube 93 fps
# on a 120 Hz output). Without the timestamps FIFO holds 119.5 fps.
# Native Asahi hardware has real vblank timing: do not ship this there.
MESA_VK_WSI_DEBUG=nowlts
