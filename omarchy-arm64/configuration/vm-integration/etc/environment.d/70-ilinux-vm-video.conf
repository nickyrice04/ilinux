# Omarchy VM (QEMU/HVF): make the fixed virgl VA-API driver the session
# default, so plain `mpv` and FFmpeg hardware-decode H.264 on the Mac's media
# engine without the `ilinux-video` wrapper (mesa-virgl-video-ilinux; D-029,
# D-032, F-052/F-053).
#
# The driver adds two things over stock Mesa's virgl VA driver:
#   * a lossless CPU download path for 8-bit 4:2:0 (fixes F-045: stock Mesa's
#     shader conversion produced wrong bytes on cross-format downloads);
#   * NV12-only decode-surface negotiation, so VideoToolbox's NV12 output is
#     used directly (no per-frame planar conversion; ~41% less QEMU CPU for
#     paced 4K60 decode).
#
# LIBVA_DRIVERS_PATH lists the fixed driver first, then stock Mesa, so video
# still works (without the fix) if mesa-virgl-video-ilinux is removed.
# To keep the download fix but turn off the NV12 narrowing, set
# VIRGL_VIDEO_DECODE_NV12=0 (overridable per app). Only the VA video driver
# changes here; OpenGL and Vulkan keep stock Mesa.
#
# VM only. Never apply on native Asahi hardware (coordination.md handoff):
# there the media engine is the M5 AVD through a V4L2 driver, not this path.
LIBVA_DRIVERS_PATH=/usr/lib/ilinux-va:/usr/lib/dri
LIBVA_DRIVER_NAME=virtio_gpu
VIRGL_VIDEO_DECODE_NV12=1
