# iLinux VM only: decode video on the Mac's media engine. The guest's VA-API
# driver (Mesa virgl) is backed by VideoToolbox on the host (D-029). VA-API
# frames reach mpv through EGL dmabuf interop, which works on OpenGL; on
# Vulkan (Venus) the interop fails and mpv decodes in software.
# Unsupported codecs fall back to software decoding automatically.
hwdec=vaapi
gpu-api=opengl
vo=gpu
# Battery: mpv's default scaling (linear-light downscaling, wide filters,
# dithering) cost 7.3 W of SoC power for 4K60 playback in the VM; the fast
# profile (bilinear) cost 3.9 W against 3.0 W for decoding alone (F-048).
# For mpv's high-quality scaling, put "profile=high-quality" in
# ~/.config/mpv/mpv.conf.
profile=fast
