# VM integration: log the owner straight into Omarchy.  Omarchy keeps autologin
# on installs whose disk is unlocked by a pre-boot password (LUKS); in the VM
# that boundary is the macOS login session that launches QEMU, and that user
# can read the disk image anyway, so an SDDM password adds no protection here.
# hypridle/hyprlock still lock the session when idle.  Delete this file to get
# the SDDM password prompt back.
[Autologin]
User=omarchy
Session=omarchy.desktop
