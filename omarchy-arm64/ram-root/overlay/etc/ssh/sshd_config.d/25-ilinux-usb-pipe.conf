# The USB byte pipe: ilinux-sshd-tty@.service runs sshd -i on a gser serial port (usb-gadget.sh).
# Bulk endpoints carry no hang-up, so sshd cannot see a client go away. Two bounds make the port free
# again by itself:
#  * LoginGraceTime: a client that gives up before it has authenticated (a wrong key, Ctrl-C, a timed-out
#    ssh) leaves its sshd waiting; the instance ends after 45 s and a new one follows within a second.
#    Key-only authentication takes well under a second, so 45 s leaves room for a human to type a
#    passphrase. (The default, 120 s, was measured: a refused key blocked the port for that long.)
#  * ClientAliveInterval x ClientAliveCountMax (60 s): an authenticated session whose client vanished.
# Then sshd exits, the unit restarts it, and the port is free for the next connection.
# Web access: the M1's ssh command (tools/m1n1-client/m5-ssh-config) reverse-forwards
# 127.0.0.1:3128 here to its localhost-only HTTP CONNECT proxy (tools/m1n1-client/connect-proxy.py).
# SetEnv gives every SSH command and shell the proxy variables that pacman (curl), mise and
# Claude Code read; /etc/environment gives them to PAM sessions. There is no DNS and no route
# on this side: the proxy on the M1 resolves names and connects.
# The socket-activated sshd on 10.66.0.2:22 (network functions) reads this file too.
LoginGraceTime 45
ClientAliveInterval 15
ClientAliveCountMax 3
SetEnv HTTPS_PROXY=http://127.0.0.1:3128 HTTP_PROXY=http://127.0.0.1:3128 https_proxy=http://127.0.0.1:3128 http_proxy=http://127.0.0.1:3128 NO_PROXY=localhost,127.0.0.1,::1 no_proxy=localhost,127.0.0.1,::1
