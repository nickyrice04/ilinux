# RAM root: key-only logins. sshd runs per connection from ilinux-sshd.socket, which listens
# on the USB link address 10.66.0.2 only.
# Keys can also arrive in a small cpio appended to the image: /etc/ssh/authorized_keys.d/<user>.
HostKey /etc/ssh/ssh_host_ed25519_key
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
