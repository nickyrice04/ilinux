# Two-stage boot, stage one (VM job 049): job 039's gadget unit stops its journal stream with SIGKILL
# (KillSignal=SIGKILL: journalctl ignores SIGTERM while a write blocks), which systemd records as a
# failure. Stage one's units are stopped by the soft-reboot into stage two and their state is carried
# into it, so that failure would show in the Omarchy root's systemctl --failed. Count it as a clean stop.
[Service]
SuccessExitStatus=SIGKILL
